<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Foco em Passos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foco em Passos">
<meta name="theme-color" content="#141019">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- HOME -->
  <section id="view-home" class="view">
    <header class="topbar">
      <h1>Minhas Rotinas</h1>
    </header>

    <div class="home-actions">
      <button id="btn-new-routine" class="btn btn-primary">+ Nova rotina</button>
      <button id="btn-quick-list" class="btn btn-secondary">⚡ Lista rápida</button>
      <button id="btn-open-notes" class="btn btn-outline">📝 Notas do dia</button>
    </div>

    <div id="routines-list" class="routines-list"></div>
    <p id="routines-empty" class="empty-msg" hidden>Você ainda não tem rotinas salvas. Crie a primeira acima.</p>
  </section>

  <!-- EDITOR -->
  <section id="view-editor" class="view" hidden>
    <header class="topbar">
      <button id="btn-cancel-editor" class="btn-icon" aria-label="Voltar">←</button>
      <h1 id="editor-title">Nova rotina</h1>
    </header>

    <label class="field">
      <span>Nome da rotina <small id="editor-name-hint">(opcional para lista rápida)</small></span>
      <input id="editor-name" type="text" placeholder="Ex: Rotina da manhã" maxlength="60">
    </label>

    <div id="tasks-list" class="tasks-list"></div>

    <button id="btn-add-task" class="btn btn-outline">+ Adicionar tarefa</button>

    <div class="editor-actions">
      <button id="btn-start-now" class="btn btn-primary">▶ Iniciar agora</button>
      <button id="btn-save-routine" class="btn btn-secondary">💾 Salvar rotina</button>
    </div>
  </section>

  <!-- RUN -->
  <section id="view-run" class="view" hidden>
    <header class="topbar">
      <button id="btn-stop-run" class="btn-icon" aria-label="Parar">✕</button>
      <div id="run-progress" class="run-progress"></div>
      <button id="btn-toggle-note" class="btn-icon" aria-label="Nota">📝</button>
    </header>

    <div id="run-routine-name" class="run-routine-name"></div>

    <div class="run-center">
      <div id="run-task-name" class="run-task-name">Tarefa</div>
      <div id="run-timer" class="run-timer">00:00</div>
      <div id="run-status" class="run-status"></div>
    </div>

    <div id="note-panel" class="note-panel" hidden>
      <label class="field">
        <span>Nota sobre esta tarefa <small>toque no microfone do teclado para ditar</small></span>
        <textarea id="note-text" rows="3" placeholder="Ex: essa tarefa está demorando mais que o previsto porque..."></textarea>
      </label>
      <div class="note-panel-actions">
        <button id="btn-cancel-note" class="btn btn-outline">Cancelar</button>
        <button id="btn-save-note" class="btn btn-primary">Salvar nota</button>
      </div>
    </div>

    <div id="run-controls-active" class="run-controls">
      <button id="btn-pause-resume" class="btn btn-outline">⏸ Pausar</button>
      <button id="btn-skip" class="btn btn-outline">⏭ Pular</button>
    </div>

    <div id="run-controls-waiting" class="run-controls" hidden>
      <button id="btn-next" class="btn btn-primary btn-big">✓ Concluí, próxima tarefa</button>
    </div>

    <div id="run-controls-finished" class="run-controls" hidden>
      <button id="btn-finish-home" class="btn btn-primary btn-big">🎉 Voltar ao início</button>
    </div>
  </section>

  <!-- NOTES -->
  <section id="view-notes" class="view" hidden>
    <header class="topbar">
      <button id="btn-back-from-notes" class="btn-icon" aria-label="Voltar">←</button>
      <h1>Notas</h1>
    </header>

    <div id="notes-days" class="notes-days"></div>
    <p id="notes-empty" class="empty-msg" hidden>Nenhuma nota ainda. Durante uma rotina, toque no ícone 📝 para registrar observações.</p>
  </section>

</div>

<script src="js/app.js"></script>
</body>
</html>
